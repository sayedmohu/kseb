<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSEB POST Test</title>
</head>

<body>

  <h2>KSEB POST Test</h2>

  <button onclick="testPost()">Add Test Bill</button>

  <pre id="result"></pre>

  <script>

    // Paste your Apps Script /exec URL between the quotes
    const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSq8_bneFP07jmlw2UyDPgyWkDMw1JYYpIORxCzRIFuoSoMOk1mYINrcrADy6--l1r4lMFirrO13GMzKyu7POQQLtD9Z696fnLaEf5qKQat5i3pgWQoMk8DGEZIwGZ3UxWeCd_cZr8eY3ouxSl0rA9d4YCId8Ia11gg4tfUIUWou5FGmTjU-HW-3ThT0atGWPQA9C2GNa2cDGzB_8nV6BjJM1erwl9FSzhgxSqLvDjkfXkLy3OFdagdl-JE2nHzAM09fUv_AM0j3crohjiwr8axGfaNqQ&lib=MkLhvDfneVOQnn5oxdXlloYfXTs7jL46d";


    async function testPost() {

      const resultBox = document.getElementById("result");

      resultBox.textContent = "Sending request...";


      const testBill = {
        bill_month: "2026-09-01",
        usage: 100,
        bill_amount: 123,
        solar_generation: 200,
        solar_exported: 50,
        kseb_import: 50,
        bank_balance: 258,
        bill_number: "TEST-001",
        bank_opening: 208
      };


      try {

        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(testBill)
        });


        resultBox.textContent =
          "Request completed. Reading response...";


        const result = await response.text();


        resultBox.textContent =
          "HTTP status: " + response.status +
          "\n\nResponse:\n" + result;


      } catch (error) {

        resultBox.textContent =
          "ERROR:\n" + error;


      }

    }

  </script>

</body>
</html>
